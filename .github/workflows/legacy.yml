name: Original tools clean Windows acceptance
on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Run all original tools for delivery, or one tool for focused diagnosis'
        type: choice
        required: true
        default: all
        options:
          - all
          - mediaflow
          - media-deep-researcher
          - mediasail
      mediaflow_path:
        description: 'MediaFlow isolated install path: Unicode failure coverage or ASCII compatibility coverage'
        type: choice
        required: true
        default: unicode
        options:
          - unicode
          - ascii
permissions:
  contents: read
jobs:
  original-tools:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      MEDIAHUB_LEGACY_TOOL: ${{ inputs.tool }}
      MEDIAHUB_MEDIAFLOW_PATH: ${{ inputs.mediaflow_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Verify and install original tools only in this disposable VM
        shell: pwsh
        run: ./scripts/accept-legacy.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediahub-legacy-acceptance
          path: |
            work/legacy-acceptance/report.json
            work/legacy-acceptance/evidence/*.json
            work/legacy-acceptance/logs/*.log
          if-no-files-found: warn
          retention-days: 14
